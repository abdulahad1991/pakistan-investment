[build]
  publish = "."

[[headers]]
  for = "/data.json"
  [headers.values]
    # CDN caches data.json for 1 hour, browser for 5 mins — fast but fresh
    Cache-Control = "public, max-age=300, s-maxage=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
