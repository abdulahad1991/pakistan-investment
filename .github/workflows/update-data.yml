name: Update Investment Data

on:
  schedule:
    # 01:00 UTC = 06:00 PKT — runs every day
    - cron: "0 1 * * *"
  workflow_dispatch:  # allow manual trigger from GitHub Actions tab

jobs:
  scrape:
    name: Scrape data to dev
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Sync dev with main
        run: |
          git config user.name  "Abdul Ahad"
          git config user.email "abdulahad1991@users.noreply.github.com"
          git fetch origin main
          git merge --ff-only origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live data
        run: python fetch_data.py

      - name: Commit updated data.json to dev
        run: |
          git config user.name  "Abdul Ahad"
          git config user.email "abdulahad1991@users.noreply.github.com"
          git diff --quiet data.json || (
            git add data.json &&
            git commit -m "chore: update investment data $(date -u +'%Y-%m-%d')" &&
            git push origin dev
          )

  merge-to-main:
    name: Merge dev into main
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge dev into main
        run: |
          git config user.name  "Abdul Ahad"
          git config user.email "abdulahad1991@users.noreply.github.com"
          git fetch origin dev
          git merge --ff-only origin/dev
          git push origin main
