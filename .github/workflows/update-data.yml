name: Update Investment Data

on:
  schedule:
    # 01:00 UTC = 06:00 PKT — runs every day
    - cron: "0 1 * * *"
  workflow_dispatch:  # allow manual trigger from GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live data
        run: python fetch_data.py

      - name: Commit updated data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet data.json || (
            git add data.json &&
            git commit -m "chore: update investment data $(date -u +'%Y-%m-%d')" &&
            git push
          )
