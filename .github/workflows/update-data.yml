name: Update Investment Data

on:
  schedule:
    # Twice a weekday, mirroring PSX hours (Mon–Fri; market is shut weekends).
    # Off-peak minutes (:37 / :41) to dodge GitHub's top-of-hour scheduler
    # backlog, which was delaying runs by hours. The open/close SESSION is keyed
    # off the cron HOUR (build_daily.py / the GROUP step below), so changing the
    # minute never affects which session a run is treated as.
    # 04:37 UTC = 09:37 PKT — "Market open", just after the 09:30 PSX open.
    - cron: "37 4 * * 1-5"
    # 11:41 UTC = 16:41 PKT — "Market close", ~1h after the 15:30 PSX close.
    - cron: "41 11 * * 1-5"
    # Weekend rate refresh (Sat+Sun, morning + afternoon PKT): gold + fx only.
    # The Sarafa market fixes a gold rate on Saturday, so without these the
    # site served Friday's gold price all weekend. Data-only — the `social`
    # job is gated to the weekday crons and never posts on weekends.
    - cron: "37 4 * * 6,0"
    - cron: "41 11 * * 6,0"
  workflow_dispatch:  # allow manual trigger from GitHub Actions tab
    inputs:
      run_weekly:
        description: "Also build + post the weekly Week-in-Review (normally Friday close only)"
        type: boolean
        default: false

jobs:
  scrape:
    name: Scrape data to dev
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Sync dev with main
        run: |
          git config user.name  "Abdul Ahad"
          git config user.email "abdulahad1991@users.noreply.github.com"
          git fetch origin main
          git merge --ff-only origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional fetch deps (gold spot cross-check)
        run: pip install -q yfinance || true

      - name: Fetch live data (cadence-aware) + merge
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          # Weekend crons -> "weekend" group (gold + fx only). Keyed to the
          # trigger cron, not wall-clock, so a scheduler-delayed run can't be
          # misrouted. Weekday morning run = "open" (fast price refresh);
          # afternoon = "close" (full refresh incl. fundamentals + dividends).
          # Manual runs (no cron) fall back to the UTC clock.
          case "$TRIGGER_CRON" in
            *"6,0") GROUP=weekend ;;
            "37 4 * * 1-5") GROUP=open ;;
            "41 11 * * 1-5") GROUP=close ;;
            *)
              HOUR=$(date -u +%H); DOW=$(date -u +%u)
              if [ "$DOW" -ge 6 ]; then GROUP=weekend
              elif [ "$HOUR" -lt 8 ]; then GROUP=open
              else GROUP=close; fi ;;
          esac
          echo "Fetcher group: $GROUP"
          python run_fetchers.py "$GROUP"

      - name: Rebuild stock history from PSX EOD (weekly, Mondays)
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            python run_fetchers.py history
          else
            echo "Not Monday (UTC) - skipping weekly stock-history rebuild"
          fi

      - name: Refresh living dividend page (weekly, Mondays)
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            python scripts/build_dividends.py "$(date -u +%F)"
          else
            echo "Not Monday (UTC) - skipping weekly dividend rebuild"
          fi

      - name: Rebuild guide/blog manifest
        run: python scripts/build_manifest.py

      - name: Commit updated data.json to dev
        run: |
          git config user.name  "Abdul Ahad"
          git config user.email "abdulahad1991@users.noreply.github.com"
          git add data.json manifest.json data/stock_history.json data/partitions blog/top-dividend-stocks-pakistan.html
          git diff --cached --quiet || (
            true &&
            git commit -m "chore: update investment data $(date -u +'%Y-%m-%d')" &&
            git push origin dev
          )

      # Habit: every blog gets a 60s Urdu explainer. Idempotent - only new blogs
      # generate audio. Soft-fails so it never blocks the data deploy.
      - name: Ensure blog explainers (Urdu 60s)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg || true
          pip install -q edge-tts deep-translator mutagen || true
          python scripts/ensure_explainers.py || true
          git add assets/blog-audio blog/*.html || true
          git diff --cached --quiet || (
            git commit -m "chore: blog Urdu explainers $(date -u +'%Y-%m-%d')" &&
            git push origin dev
          )

  merge-to-main:
    name: Merge dev into main
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge dev into main
        run: |
          git config user.name  "Abdul Ahad"
          git config user.email "abdulahad1991@users.noreply.github.com"
          git fetch origin dev
          git merge --ff-only origin/dev
          git push origin main

  # The `social` job commits the homepage daily-brief video to dev AFTER
  # merge-to-main has already fast-forwarded main — so without this, the video
  # (which embeds the session's market numbers) reaches production one session
  # late, sitting next to fresh live cards. This final fast-forward republishes
  # main to dev's HEAD once both jobs finish. if:always() so a Remotion render
  # failure in `social` can never block the data deploy.
  republish-main:
    name: Republish main after social
    needs: [merge-to-main, social]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fast-forward main to dev HEAD
        run: |
          git config user.name  "Abdul Ahad"
          git config user.email "abdulahad1991@users.noreply.github.com"
          git fetch origin dev
          git merge --ff-only origin/dev && git push origin main || \
            echo "main already up to date with dev"

  social:
    name: Render daily social assets
    needs: scrape
    # Weekday sessions + manual runs only: weekend crons are a data-only
    # gold/fx refresh — PSX is shut, so there is no market brief to post.
    if: ${{ github.event_name == 'workflow_dispatch' ||
            github.event.schedule == '37 4 * * 1-5' ||
            github.event.schedule == '41 11 * * 1-5' }}
    # Renders the daily-brief video (homepage mp4 + social) and auto-posts.
    # NOTE re AdSense recovery (2026-06-29): this only commits an .mp4 + caption —
    # no HTML/sitemap change — so it does NOT affect crawling/indexing. The thing
    # that hurt was the templated sector HTML pages (deleted), not this video.
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Pull the data commit the scrape job just pushed
        run: git pull --ff-only origin dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: video/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install video dependencies
        working-directory: video
        run: npm ci

      # MUST run before the Remotion renders: it writes video/daily-props.json,
      # which the compositions pick up at render time. (No narration deps —
      # the briefs are music/SFX only since 2026-07-03; blog explainers keep
      # their own edge-tts install in the explainers job.)
      - name: Build daily props + caption
        # Pass the scheduled cron through so the session (open/close) is keyed to
        # the cron HOUR, not wall-clock — GitHub can delay a run by hours, which
        # would otherwise mislabel a delayed morning brief as "Market close".
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: python scripts/build_daily.py

      - name: Render YouTube Short (9:16)
        working-directory: video
        run: npx remotion render DailyBrief-9x16 --props=daily-props.json out/daily/short.mp4

      # Guard: a full brief incl. the Like/Subscribe/Share outro is ~26.8s
      # (804f @30fps: pie removed, spotlight added, cta +1s — 2026-07-04). If
      # the outro scene is ever dropped (stale checkout, a scene crash
      # truncating the render), duration falls to ~24s — refuse to post rather
      # than push an outro-less Short. Skips silently if ffprobe is unavailable
      # so it can never wedge the pipeline on tooling alone.
      - name: Guard — outro present before posting
        working-directory: video
        run: |
          command -v ffprobe >/dev/null || { echo "ffprobe unavailable — skipping outro guard"; exit 0; }
          dur=$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 out/daily/short.mp4)
          echo "short.mp4 = ${dur}s (expect ~26.8s with outro; <25s ⇒ outro dropped)"
          awk -v d="$dur" 'BEGIN{ exit (d+0 >= 25.0) ? 0 : 1 }' || {
            echo "::error::Short is ${dur}s (<25s) — outro (Like/Subscribe/Share) missing. Refusing to post.";
            exit 1;
          }

      - name: Render LinkedIn video (1:1)
        working-directory: video
        run: npx remotion render DailyBrief-1x1 --props=daily-props.json out/daily/linkedin.mp4

      - name: Render LinkedIn still (1:1)
        working-directory: video
        run: npx remotion still DailyCard-1x1 --props=daily-props.json out/daily/card.png --frame=60

      # Homepage video — DailyBrief in 16:9, committed to the repo (Pages serves
      # only committed files). Fixed filename: overwritten each run, never piles up.
      - name: Render homepage daily brief (16:9)
        working-directory: video
        run: |
          npx remotion render DailyBrief-16x9 --props=daily-props.json ../assets/daily-brief.mp4 --crf=23
          npx remotion still DailyBrief-16x9 --props=daily-props.json ../assets/daily-brief-poster.jpg --frame=150 --image-format=jpeg

      - name: Upload daily assets (download to post manually)
        uses: actions/upload-artifact@v4
        with:
          name: daily-social-${{ github.run_id }}
          path: video/out/daily/*
          retention-days: 14

      - name: Commit homepage brief + caption to dev
        run: |
          git config user.name  "Abdul Ahad"
          git config user.email "abdulahad1991@users.noreply.github.com"
          git add social-kit/daily/*.md social-kit/daily/*.json assets/daily-brief.mp4 assets/daily-brief-poster.jpg
          git diff --cached --quiet || (
            git commit -m "chore: daily market brief + caption $(date -u +'%Y-%m-%d')" &&
            git push origin dev
          )

      # Auto-post the rendered videos. Both steps no-op (exit 0) when their
      # secrets are absent, and are continue-on-error so a posting failure (e.g.
      # a lapsed 60-day LinkedIn token) never blocks the data/homepage pipeline.
      - name: Install auto-post dependencies
        run: pip install -r scripts/requirements-social.txt

      - name: Auto-post Short to YouTube (public)
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/post_youtube.py

      - name: Auto-post video to LinkedIn company page
        continue-on-error: true
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_VERSION: ${{ secrets.LINKEDIN_VERSION }}
        run: python scripts/post_linkedin.py

      - name: Auto-post Short to TikTok
        continue-on-error: true
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODE: ${{ secrets.TIKTOK_MODE }}        # direct|inbox (default direct)
          TIKTOK_PRIVACY: ${{ secrets.TIKTOK_PRIVACY }}  # default PUBLIC_TO_EVERYONE
        run: python scripts/post_tiktok.py

      # ---- Weekly Week-in-Review (Fridays, close session only) ---------------
      # Runs AFTER all daily posting so a weekly failure can never cost the
      # daily pipeline. Gated on the close cron + Friday (cron hour, not
      # wall-clock, same delay-proof logic as the session label), with a
      # workflow_dispatch override for manual runs.
      - name: Decide whether to run the weekly review
        id: weekly
        env:
          FORCE_WEEKLY: ${{ inputs.run_weekly }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          GO=false
          if [ "$FORCE_WEEKLY" = "true" ]; then
            GO=true
          elif [ "$TRIGGER_CRON" = "41 11 * * 1-5" ] && [ "$(date -u +%u)" = "5" ]; then
            GO=true
          fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          echo "Weekly review: $GO"

      # Writes video/weekly-props.json (must precede the WeeklyBrief render,
      # mirroring the daily flow). Music/SFX only — no narration.
      - name: Build weekly props + caption
        if: steps.weekly.outputs.go == 'true'
        run: python scripts/build_weekly.py

      - name: Render weekly review (16:9)
        if: steps.weekly.outputs.go == 'true'
        continue-on-error: true
        working-directory: video
        run: npx remotion render WeeklyBrief-16x9 --props=weekly-props.json out/weekly/review.mp4 --crf=23

      - name: Commit weekly caption to dev
        if: steps.weekly.outputs.go == 'true'
        continue-on-error: true
        run: |
          git config user.name  "Abdul Ahad"
          git config user.email "abdulahad1991@users.noreply.github.com"
          git add social-kit/weekly
          git diff --cached --quiet || (
            git commit -m "chore: weekly market review $(date -u +'%Y-%m-%d')" &&
            git push origin dev
          )

      # Same secrets-missing no-op + continue-on-error pattern as the daily
      # posts. Long-form 16:9 upload — post_youtube.py skips cleanly if the
      # render above failed (no file), and never adds #Shorts to weekly copy.
      - name: Auto-post weekly review to YouTube (public)
        if: steps.weekly.outputs.go == 'true'
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python scripts/post_youtube.py \
            --video video/out/weekly/review.mp4 \
            --caption "social-kit/weekly/$(date -u +%F).json"
